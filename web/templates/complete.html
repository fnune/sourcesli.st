{{define "complete"}}
{{if .}}
<ul class="absolute z-10 mt-1 w-full overflow-hidden rounded-md border border-line-strong bg-surface shadow-lg">
    {{range .}}
    <li>
        <a class="block px-3 py-2 hover:bg-muted" href="/p/{{.Suite}}/{{.Name}}">
            <span class="font-mono">{{.Name}}</span>
            {{if .Synopsis}}<span class="ml-2 text-sm text-ink-subtle">{{.Synopsis}}</span>{{end}}
        </a>
    </li>
    {{end}}
</ul>
{{end}}
{{end}}
