{{define "results"}}
{{if .Results.Rows}}
{{template "packages" .Results}}
{{else if .Query}}

<p class="mt-4 text-ink-muted">Nothing matched. Did you mean:</p>
{{template "packages" .Suggestions}}
{{else}}
<p class="mt-4 text-ink-muted">
    Nothing matched. Try a shorter query, or a different suite.
</p>
{{end}}
{{end}}
{{end}}
