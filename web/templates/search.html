{{define "title"}}{{if .Query}}{{.Query}}{{else}}Search{{end}}{{end}}

{{define "content"}}
{{template "searchform" .}}

<section class="mt-8">
    {{if .Query}}
        <h1 class="text-lg font-semibold">
            {{len .Results}} result{{if ne (len .Results) 1}}s{{end}}
            for <span class="font-mono">{{.Query}}</span> in <span class="font-mono">{{.Suite}}</span>
        </h1>
    {{end}}
    {{template "results" .}}
</section>
{{end}}
