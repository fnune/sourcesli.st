services:
  backend:
    build:
      context: ./src/backend
    ports:
      - "8080:8080"
    volumes:
      - ./src/backend:/app

  database:
    build:
      context: ./src/database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sourceslist
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "3000:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html

  processing:
    build:
      context: ./src/processing
    volumes:
      - ./src/processing:/app

volumes:
  postgres_data:
